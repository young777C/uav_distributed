data:
  episodes_glob: /nvidia/hque/data/carla_data/mvp_full/episode_*.h5
  context_cache: runs/ctx_cache_full
  frame_stride: 3
  max_frames_per_episode: 500
  val_frac: 0.15
  split_manifest: train/splits/mvp_full_split.json
  test_town: Town05
  stage2_context_cache: runs/ctx_cache_ml_full
backbone:
  kind: qwen3vl
  model_id: Qwen/Qwen3-VL-4B-Instruct
  layer: 24
  ctx_grid: 10
  device: cuda:0
  neutralize_language: true
fps: 10
image:
  width: 336
  height: 336
  fov_deg: 90.0
  vehicle_size_m: 4.0
  box_min_px: 10
  box_max_px: 140
waypoint:
  offsets_s:
  - 1
  - 2
  - 4
  - 6
  K: 4
  max_horizon_s: 6
  relative_to_uav: true
  camera_frame: true
  scale: 50.0
ear:
  d_model: 256
  n_layers: 4
  n_heads: 4
flow:
  sample_steps: 8
train:
  epochs: 50
  lr: 0.0002
  batch_size: 64
  weight_decay: 0.0001
  workers: 4
  device: cuda:0
  ckpt_dir: runs/stage1_ear_full
  staleness_p: 0.3
  staleness_noise: 0.2
  supervise_intercept: true
  ear_ckpt: runs/stage1_ear_full/stage1_ear_best.pt
  grad_clip: 1.0
  stage2_ckpt_dir: runs/stage2_full_v2
eval:
  every: 5
  gate_mse_6s_m: 10.0
seed: 0
action:
  horizon: 16
  scale: 5.0
model:
  cond_dim: 2560
  ear:
    d_model: 256
    n_layers: 4
    n_heads: 4
  iar:
    d: 256
    n_im: 8
    n_heads: 4
  dit:
    d_model: 512
    n_layers: 32
    n_heads: 8
  tid_d: 256
loss:
  ear: 0.3
  vis: 0.1
  maneuver: 0.1
  target_id: 0.5
curriculum:
  a_floor: 0.25
  ramp: 0.9
