# Paper 2: Main experiment sweep — C3 communication only
# C3 = F1(distance decay) + F2(local shadow) + F3(stochastic jitter)
#
# Runs: all 6 baselines × 4 G2 conflict levels (M0–M3) = 24 jobs

sweep:
  description: "Paper 2 §6 main comparison — C3 communication degradation"

  experiments:
    - key: greedy_distance
      label: Greedy-Distance
    - key: centralized_rhp
      label: Centralized-RHP
    - key: periodic_dual_rhp
      label: Periodic-Dual-RHP
    - key: event_dual_rhp
      label: Event-Dual-RHP
    - key: epa_rhp_centralized
      label: EPA-RHP-Centralized
    - key: d_epa_rhp
      label: D-EPA-RHP (proposed)

  scenes:
    - scene_cfg: c3_g2_m0
      label: C3-G2-M0 (low conflict)
      comm_case: C3
      task_case: G2
      conflict_level: M0
    - scene_cfg: c3_g2_m1
      label: C3-G2-M1 (medium conflict)
      comm_case: C3
      task_case: G2
      conflict_level: M1
    - scene_cfg: c3_g2_m2
      label: C3-G2-M2 (high conflict)
      comm_case: C3
      task_case: G2
      conflict_level: M2
    - scene_cfg: c3_g2_m3
      label: C3-G2-M3 (severe conflict)
      comm_case: C3
      task_case: G2
      conflict_level: M3

  common:
    n_episodes: 10
    seed: 42
    step_hz: 5
    episode_steps: 2000
    key_bits_per_poi: 4000000

  output_dir: "results/paper2/c3_main_sweep"
