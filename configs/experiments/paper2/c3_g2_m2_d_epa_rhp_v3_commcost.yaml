# V3: C3 with explicit communication cost — tests VoI feedback advantage.
# Communication cost penalizes every feedback transmission, making
# D-EPA-RHP's selective VoI feedback valuable compared to always-send baselines.
extends:
  - ../paper1/cases/c3_g2_m2.yaml

experiment:
  paper1:
    struct: fdlc
    modeling: comm_energy_aware_decision
    coupling: full_coupling
  paper2:
    experiment: d_epa_rhp
  n_episodes: 10
  seed: 42

paper2:
  feedback_threshold: 0.15
  adaptive_schedule: true
  lambda_d: 1.0
  lambda_m: 0.5
  # V3: communication cost parameters
  comm_cost_per_feedback_j: 5000.0  # energy penalty per feedback transmission (Joules)
  enable_comm_cost: true
