# C3 low degradation: 0.75 x medium (F1 + F2 + F3).
# F1 distance decay, F2 local shadow, F3 stochastic fading — scaled together.
train:
  comm_mode: degraded

comm:
  # F1: smooth distance-dependent degradation from GCS to UAV.
  enable_distance_decay: true
  distance_d0_m: 0.0
  distance_d1_m: 2500.0
  distance_loss_min: 0.0375
  distance_loss_max: 0.30

  # F2: extra local degradation inside scene communication shadow regions.
  use_scene_blackholes: true
  blackhole_extra_loss: 0.1125

  # F3: stochastic time-varying fading.
  loss_jitter_sigma: 0.06
  data_chunk_bits: 4000000.0

experiment:
  comm_degradation:
    level: low
    multiplier: 0.75
