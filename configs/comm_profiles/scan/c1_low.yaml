# C1 low degradation: 0.75 x the current medium profile.
train:
  comm_mode: degraded

comm:
  enable_distance_decay: true
  distance_d0_m: 0.0
  distance_d1_m: 2500.0
  distance_loss_min: 0.0375
  distance_loss_max: 0.30
  loss_jitter_sigma: 0.06
  delay_mean_s: 0.075
  delay_jitter_s: 0.06
  use_scene_blackholes: false

experiment:
  comm_degradation:
    level: low
    multiplier: 0.75
