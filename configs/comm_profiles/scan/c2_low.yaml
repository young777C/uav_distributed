# C2 low degradation: 0.75 x base loss, shadow loss, delay, and fading.
train:
  comm_mode: degraded

comm:
  enable_distance_decay: false
  base_loss: 0.1125
  use_scene_blackholes: true
  blackhole_extra_loss: 0.1125
  loss_jitter_sigma: 0.06
  delay_mean_s: 0.075
  delay_jitter_s: 0.06
  data_chunk_bits: 4000000.0

experiment:
  comm_degradation:
    level: low
    multiplier: 0.75
