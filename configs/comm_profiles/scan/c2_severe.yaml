# C2 severe degradation: 1.50 x base loss, shadow loss, delay, and fading.
train:
  comm_mode: degraded

comm:
  enable_distance_decay: false
  base_loss: 0.225
  use_scene_blackholes: true
  blackhole_extra_loss: 0.225
  loss_jitter_sigma: 0.12
  delay_mean_s: 0.15
  delay_jitter_s: 0.12
  data_chunk_bits: 4000000.0

experiment:
  comm_degradation:
    level: severe
    multiplier: 1.5
