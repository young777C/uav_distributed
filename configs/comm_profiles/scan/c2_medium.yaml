# C2 medium degradation: current paper baseline.
train:
  comm_mode: degraded

comm:
  enable_distance_decay: false
  base_loss: 0.15
  use_scene_blackholes: true
  blackhole_extra_loss: 0.15
  loss_jitter_sigma: 0.08
  delay_mean_s: 0.10
  delay_jitter_s: 0.08
  data_chunk_bits: 4000000.0

experiment:
  comm_degradation:
    level: medium
    multiplier: 1.0
