# Layer-2: Comm profile C1 = F1 + F3
# - smooth distance-decay + stochastic time-varying fading
train:
  comm_mode: degraded

comm:
  enable_distance_decay: true
  distance_d0_m: 0.0
  distance_d1_m: 2500.0
  distance_loss_min: 0.05
  distance_loss_max: 0.40

  # stochastic fading
  loss_jitter_sigma: 0.08

  # C1 does not use local shadow zones by default
  use_scene_blackholes: false

