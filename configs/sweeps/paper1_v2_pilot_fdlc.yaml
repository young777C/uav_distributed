# Paper1 V2 Pilot — FDLC (via run_vis)
# Purpose: Validate the C3 16-scene matrix with 2 seeds × 2 episodes
# before launching the full 8×20 production sweep.
#
# Pilot scenes: low-M0, medium-M2, high-M3, severe-M3

axis_grid:
  cases:
    - configs/experiments/paper1/cases/c3_low_m0.yaml
    - configs/experiments/paper1/cases/c3_medium_m2.yaml
    - configs/experiments/paper1/cases/c3_high_m3.yaml
    - configs/experiments/paper1/cases/c3_severe_m3.yaml
  systems:
    - configs/experiments/paper1/system/struct_full_dual_loop_distributed.yaml

episodes: 2
seeds: [0, 1]
slow_interval_steps_list: [40]
comm_mode: ""
runs_root: results_v2/pilot
runner_module: uavlab.paper1.runner.run_vis
