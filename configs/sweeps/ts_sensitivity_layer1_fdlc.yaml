# Dual time-scale sensitivity — Layer 1: FDLC across C1–G2–M2 and C2–G2–M2.
#
# Scans ρ ∈ {5, 10, 20, 40, 80} with 5 seeds, 5 episodes each.
# Fixed fast-loop T_f = 0.2 s (1 step at 5 Hz).
axis_grid:
  cases:
    - configs/experiments/paper1/cases/c1_g2_m2.yaml
    - configs/experiments/paper1/cases/c2_g2_m2.yaml
  systems:
    - configs/experiments/paper1/system/struct_full_dual_loop_distributed.yaml

episodes: 5
seeds: [0, 1, 2, 3, 4]
slow_interval_steps_list: [5, 10, 20, 40, 80]
comm_mode: ""
runs_root: results/ts_sensitivity
runner_module: uavlab.paper1.runner.run_vis
