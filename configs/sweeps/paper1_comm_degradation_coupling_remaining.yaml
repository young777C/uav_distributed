# Resume plan after the low-intensity Periodic/Event-driven groups.
# Full Coupling is configuration-equivalent to the C2 FDLC architecture group
# and is reused during aggregation to avoid duplicate stochastic runs.
axis_grid:
  cases:
    - configs/experiments/paper1/cases/comm_degradation_scan/c2_g2_m2_medium.yaml
    - configs/experiments/paper1/cases/comm_degradation_scan/c2_g2_m2_high.yaml
  systems:
    - configs/experiments/paper1/system/coupling_periodic_goal.yaml
    - configs/experiments/paper1/system/coupling_event_driven_goal.yaml

episodes: 5
seeds: [0, 1, 2]
slow_interval_steps_list: [40]
comm_mode: ""
runs_root: results/comm_degradation_scan_20260620_103457
runner_module: uavlab.paper1.runner.run
