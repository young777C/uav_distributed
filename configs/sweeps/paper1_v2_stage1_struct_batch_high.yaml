# Paper1 V2 Stage 1 Struct — Batch: high intensity
#
# Run with:
#   PYTHONPATH=src python3 scripts/sweep.py \
#     --plan configs/sweeps/paper1_v2_stage1_struct_batch_high.yaml \
#     --tag stage1_struct_20260629

axis_grid:
  cases:
    - configs/experiments/paper1/cases/c3_high_m0.yaml
    - configs/experiments/paper1/cases/c3_high_m1.yaml
    - configs/experiments/paper1/cases/c3_high_m2.yaml
    - configs/experiments/paper1/cases/c3_high_m3.yaml
  systems:
    - configs/experiments/paper1/system/struct_centralized_single_loop.yaml
    - configs/experiments/paper1/system/struct_decoupled_dual_loop.yaml
    - configs/experiments/paper1/system/struct_full_dual_loop_distributed.yaml

episodes: 15
seeds: [0, 1, 2, 3, 4]
slow_interval_steps_list: [40]
comm_mode: ""
runs_root: results_v2/stage1_struct
runner_module: uavlab.paper1.runner.run_vis
