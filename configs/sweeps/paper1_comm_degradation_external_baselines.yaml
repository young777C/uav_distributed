# Sweep plan: communication degradation sensitivity for external baselines.
#
# This complements the existing internal architecture scan by running
# RHC-Inspection and CBCP on the same C1/C2, G2-M2, low/medium/high cases.

axis_grid:
  cases:
    - configs/experiments/paper1/cases/comm_degradation_scan/c1_g2_m2_low.yaml
    - configs/experiments/paper1/cases/comm_degradation_scan/c1_g2_m2_medium.yaml
    - configs/experiments/paper1/cases/comm_degradation_scan/c1_g2_m2_high.yaml
    - configs/experiments/paper1/cases/comm_degradation_scan/c2_g2_m2_low.yaml
    - configs/experiments/paper1/cases/comm_degradation_scan/c2_g2_m2_medium.yaml
    - configs/experiments/paper1/cases/comm_degradation_scan/c2_g2_m2_high.yaml
  systems:
    - configs/experiments/paper1/system/baseline_rhc_inspection.yaml
    - configs/experiments/paper1/system/baseline_cbcp.yaml

episodes: 5
seeds: [0, 1, 2]
slow_interval_steps_list: [40]
comm_mode: ""
runs_root: results/comm_degradation_external_baselines
runner_module: uavlab.paper1.runner.run_baseline
