# Dual time-scale sensitivity — Layer 2: Periodic Goal on C2–G2–M2.
#
# Scans ρ ∈ {5, 10, 20, 40, 80} with 5 seeds, 5 episodes each.
# Tests pure periodic replan (no event feedback) vs. FDLC (Layer 1).
axis_grid:
  cases:
    - configs/experiments/paper1/cases/c2_g2_m2.yaml
  systems:
    - configs/experiments/paper1/system/coupling_periodic_goal.yaml

episodes: 5
seeds: [0, 1, 2, 3, 4]
slow_interval_steps_list: [5, 10, 20, 40, 80]
comm_mode: ""
runs_root: results/ts_sensitivity
runner_module: uavlab.paper1.runner.run_vis
