# Sweep plan: Paper1 external baselines (RHC-Inspection + CBCP)
#
# Runs the two external baselines across all env cases.
#
# Usage:
#   PYTHONPATH=src python3 scripts/sweep.py --plan configs/sweeps/paper1_external_baselines.yaml
#
# Output under runs/baselines/<tag>/, with summary.csv at the end.

axis_grid:
  cases: configs/experiments/paper1/cases/c*.yaml
  systems: configs/experiments/paper1/system/baseline_*.yaml

episodes: 5
seeds: [0, 1, 2]
slow_interval_steps_list: [40]
comm_mode: ""
runs_root: results/baselines
runner_module: uavlab.paper1.runner.run_baseline
