# Stage 1 — FDLC P0 re-run (mode dwell hysteresis + phase entry/exit hysteresis)
# Only FDLC (struct_full_dual_loop_distributed), 16 scenes, 5 seeds × 15 eps
axis_grid:
  cases:
    - configs/experiments/paper1/cases/c3_low_m0.yaml
    - configs/experiments/paper1/cases/c3_low_m1.yaml
