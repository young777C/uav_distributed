# Occlusion / recovery emphasis (A1c③). Occlusion is now ACTIVELY produced: the target
# is spawned so it drives UNDER overhead structures (bridge/overpass/gantry) and
# re-emerges — a clean, transient, recoverable in-frame structural occlusion. Validation
# finding: in-frame structural occlusion is physically SPARSE in aerial view (most
# occlusion = target leaves frame), and an oblique camera produced framing failures
# (target dropped off the bottom edge), so oblique is DROPPED — top-down only. The
# deliverable is clean transient occlusion EVENTS, not a high frame-fraction. Towns by
# measured overhead-occluder density: Town03 6.3% > Town05 2.5% > Town04 1.3% ~ Town10HD.
environment:
  towns: ["Town03", "Town05", "Town04", "Town10HD"]
  max_occluded_seconds: 10         # let the target cross a bridge and re-emerge (recoverable)

# Spawn the target so it drives into a TRANSIENT overhead occluder on most episodes.
occlusion:
  enabled: true
  bias_fraction: 0.8
  max_cover_span_m: 40.0           # accept wider bridges (≤~6 s cover) → longer clean events
  min_occlusion_ratio: 0.4         # aspirational label target (QC), not force-injected

uav:
  perturbation:
    probability: 0.05
    min_interval: 6.0

scene:
  num_distractors: [5, 8]
  min_similar_distractors: 2
  target_class_weights:      # weights are MERGED onto default → list all classes
    car: 0.85
    motorcycle: 0.15
    bicycle: 0.0
    scooter: 0.0
    pedestrian: 0.0          # background only
  similarity_strategy_weights:
    same_color_diff_shape: 0.5
    same_shape_diff_color: 0.5
    distinct: 0.0
