# TEMP: pure calm autopilot (no recycle, no set_route, no raw-control maneuvers)
# to verify smooth, rule-abiding driving with zero collisions / off-road.
environment:
  towns: ["Town03"]
scene:
  num_distractors: [5, 8]
  min_similar_distractors: 3
  target_class_weights:
    car: 1.0
    motorcycle: 0.0
    bicycle: 0.0
    scooter: 0.0
    pedestrian: 0.0
  similarity_strategy_weights:
    same_color_diff_shape: 0.5
    same_shape_diff_color: 0.5
    distinct: 0.0
target:
  maneuver:
    sudden_stop_prob: 0.0
    sharp_turn_prob: 0.0
    acceleration_prob: 0.0
    u_turn_prob: 0.0
