# Held-out town (Town05) for cross-town generalization eval (design §7.2).
# NOT for training — generate with a disjoint seed range from the train set.
environment:
  towns: ["Town05"]

scene:
  num_distractors: [4, 8]
  min_similar_distractors: 2
  target_class_weights:
    car: 0.65
    motorcycle: 0.18
    bicycle: 0.10
    scooter: 0.07
    pedestrian: 0.0    # background only
  similarity_strategy_weights:
    same_color_diff_shape: 0.40
    same_shape_diff_color: 0.40
    distinct: 0.20
