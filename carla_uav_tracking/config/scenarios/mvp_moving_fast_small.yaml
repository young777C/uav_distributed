# 2026-10-09 smoke4 (user decision "B"): = mvp_moving_fast.yaml with ambient.vehicles 80 → 40, for the small,
# light-dense towns (Town01 / Town02) where smoke3 failed on red-light queues (6 s green cannot pass the 9-car convoy
# + 80 ambient cars in one cycle). Config only — no generator code change. Diff vs mvp_moving_fast: ambient.vehicles.
# 2026-10-09 FEASIBILITY smoke (user decision): realistic urban speeds — scene actors 10-12 m/s, expert UAV
# horizontal limit 15 m/s — with anti-gridlock (scene.kinematics, scene_manager._apply_kinematics/_unjam_step).
# = mvp.yaml + ring-spawned ambient (radius 200 so ring cars are not respawned next to the target) + lane changes +
# shortened light cycles; scene actors OBEY lights here (running reds at 11 m/s caused junction gridlock risk).
# MVP dataset (~60 episodes / ~100K frames) — EAR convergence + demo (design §4.1).
# Balanced across classes and both car-similarity strategies, moderate difficulty.
environment:
  max_duration_seconds: 150
  towns: ["Town01", "Town02", "Town04", "Town05", "Town10HD"]
  loss_events:                     # (c) enable deliberate sustained loss → predict-intercept
    enabled: true
    per_episode: 2
    dur_range: [4.5, 6.5]          # >=3s off-frame run after ~1s exit lag → recovery counts

scene:
  # --- 2026-10-09 feasibility switches (see header) ---
  scene_actors_lane_change: true
  traffic_lights: {green_s: 6.0, yellow_s: 2.0, red_s: 2.0}
  ambient:
    vehicles: 40                     # mvp_moving_fast: 80 (default) → 40 for Town01/02
    spawn_mode: ring
    ring_m: [30.0, 200.0]
    radius: 200
  kinematics:
    actor_speed_mps: [10.0, 12.0]     # target: U(10, 12); distractors: target ± 0.5 (clipped)
    distractor_jitter_mps: 0.5
    ambient_speed_mps: [9.0, 12.0]    # ambient cars (legacy: limit − 20 % ≈ 6.7 m/s)
    evade_speed_mps: 10.0             # loss-window evade (legacy 16 km/h); restore = the target's own speed
    unjam:
      still_mps: 0.3
      radius_m: 80.0
      actor_still_s: 12               # target / distractor stuck (not queued at a red): TM force_lane_change / 4 s
      blocker_still_s: 20             # … still stuck → the car right ahead of it in its lane is relocated
      ambient_still_s: 25             # ambient car near the target stuck (not at a red) → relocated 150-300 m away
      ambient_visible_still_s: 40     # … but one inside the camera frame only after 40 s (avoid visible jumps)
      truncate_stuck_s: 40            # recorder last resort: target moved < 5 m in 40 s → truncate (fails QC)
  num_distractors: [4, 8]
  min_similar_distractors: 2
  distractor_ahead_bias: 0.75
  target_class_weights:            # spec §4d: all-sedan scene → rich look-alike pool (21 models × 18
    car: 1.0                        # colours), higher co-visibility; drop sparse moto/bike/scooter
    motorcycle: 0.0                 # (only 1-3 models each → too few look-alikes) + pedestrians (never targets)
    bicycle: 0.0
    scooter: 0.0
    pedestrian: 0.0
  similarity_strategy_weights:
    same_color_diff_shape: 0.40
    same_shape_diff_color: 0.40
    distinct: 0.20

target:
  maneuver:                # OFF — stochastic TM maneuvers only fragment loss into
                           # sub-second blips AND re-correlate target geometry (round-2
                           # regressed offscreen+recovery+leak). Sustained loss is created
                           # deliberately by environment.loss_events (blind-predict window)
                           # instead. See acot-uav-review-loop / data-fix-spec (c).
    sudden_stop_prob: 0.0
    sharp_turn_prob: 0.0
    acceleration_prob: 0.0
    u_turn_prob: 0.0

uav:
  expert_policy:
    pid_params:
      kp_xy: [0.9, 1.2]                # default 0.5-0.8: P-only lag ≈ v/kp = 15-24 m at 12 m/s → 10-13 m
    velocity_limits:
      xy_max: 15.0                     # m/s (default 12): keeps up with 10-12 m/s targets
      strict: true                     # cap the FINAL |v_xy| (after noise; per-axis clip allowed √2·xy_max)
