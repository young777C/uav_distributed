# Legacy configuration surface → acot (framework §6.2). acot/tests/test_legacy_surface.py checks this file against
# acot/tools/legacy_surface.py:collect() in BOTH directions (every surface row mapped; no stale entries).
# The runtime sections (policy_server, run_rollout, env) are also the TRANSLATION TABLE of acot/config/legacy.py:
#   from: <dotted path in the resolved arm> (first existing path of a list; absent → argparse / code default)
#   map:  value mapping; when_head: only for these heads; infra / collect / fixed / build: see legacy.py.

categories:              # whole-category dispositions (argparse flags and sys.argv use of files in these categories)
  analysis: {disposition: replaced, by: acot.analysis (one metrics/stats implementation, experiment-driven reports)}
  test: {disposition: kept, as: test tooling}
  other-owner: {disposition: not_migrated, owner: v6 data session (runs/data_v6)}

files:                   # offline / datagen scripts: all their flags / argv collectively
  train/tah_train.py: {disposition: wrapped, by: "acot train (trainer tah_relm)"}
  train/tah_cache.py: {disposition: wrapped, by: "acot prep (kind tah_seq)"}
  train/tah_merge.py: {disposition: wrapped, by: "acot prep (kinds tah_seq / dagger)"}
  train/backbone_kv.py: {disposition: wrapped, by: "acot prep (kind vlm_ctx)"}
  train/make_split.py: {disposition: superseded, by: "acot data split (rules naive / town_heldout)"}
  train/stage1_ear.py: {disposition: legacy_import, as: "artefact import (stage-1 EAR ckpt)"}
  train/stage2.py: {disposition: legacy_import, as: "artefact import stage2_ckpt (retraining not reproduced)"}
  carla_uav_tracking/rollout/opening_cls.py: {disposition: wrapped, by: "acot train (trainer opening_attr_lin)"}
  carla_uav_tracking/rollout/opening_ft.py: {disposition: wrapped, by: "acot train (trainer opening_attr_ft)"}
  carla_uav_tracking/rollout/opening_score.py: {disposition: legacy_only, reason: "offline opening scorer study; its describe() is proven equal to acot/data/language.py"}
  train/grounding_train.py: {disposition: legacy_only, reason: grounding-head experiments (not in the final model)}
  train/qwen_lora_grounding.py: {disposition: legacy_only, reason: LoRA grounding experiment}
  train/qwen_lora_paired_eval.py: {disposition: legacy_only, reason: LoRA grounding experiment}
  train/reid_metric_train.py: {disposition: legacy_only, reason: reid metric-learning experiment}
  train/bc_center_train.py: {disposition: legacy_only, reason: BC negative result (907)}
  train/rl_e0_center.py: {disposition: legacy_only, reason: RL-E0 negative result (907)}
  train/dagger_train.py: {disposition: legacy_only, reason: grounding DAgger experiment}
  train/audit_bearing.py: {disposition: legacy_only, reason: offline probe}
  train/baseline_deadreckon.py: {disposition: legacy_only, reason: offline probe}
  train/benchmark_leak_probe.py: {disposition: legacy_only, reason: offline probe}
  train/check_data_ready.py: {disposition: legacy_only, reason: data check}
  train/eval_stage1.py: {disposition: legacy_only, reason: offline eval of stage 1}
  train/fullframe_probe.py: {disposition: legacy_only, reason: offline probe}
  train/grounding_attr_probe.py: {disposition: legacy_only, reason: offline probe}
  train/grounding_head_compare.py: {disposition: legacy_only, reason: offline probe}
  train/grounding_probe.py: {disposition: legacy_only, reason: offline probe}
  train/grounding_probe_midepisode.py: {disposition: legacy_only, reason: offline probe}
  train/intercept_eval.py: {disposition: legacy_only, reason: offline eval}
  train/recrop_probe.py: {disposition: legacy_only, reason: offline probe}
  train/reid_resolution_probe.py: {disposition: legacy_only, reason: offline probe (its _dino_feats is used by the policy)}
  train/mmap_cache.py: {disposition: legacy_only, reason: cache utility}
  acot_probe/run_probe.py: {disposition: legacy_only, reason: early probing study}
  acot_probe/visualize.py: {disposition: legacy_only, reason: visualisation}
  carla_uav_tracking/scripts/generate_batch.py: {disposition: wrapped, by: "acot data gen (per plan item, via gen_seed_town_list.sh)"}
  carla_uav_tracking/scripts/generate_single.py: {disposition: superseded, by: "acot data gen"}
  carla_uav_tracking/scripts/launch_parallel.py: {disposition: superseded, by: "acot data gen (workers)"}
  carla_uav_tracking/scripts/qc_report.py: {disposition: superseded, by: "acot data qc"}
  carla_uav_tracking/scripts/qc_v6.py: {disposition: not_migrated, owner: v6 data session}
  carla_uav_tracking/scripts/annotate_road_pred.py: {disposition: legacy_only, reason: visualisation}
  carla_uav_tracking/scripts/h5_to_mp4.py: {disposition: legacy_only, reason: visualisation}
  carla_uav_tracking/scripts/render_video.py: {disposition: legacy_only, reason: visualisation}
  carla_uav_tracking/scripts/visualize_episode.py: {disposition: legacy_only, reason: visualisation}
  carla_uav_tracking/scripts/_measure_occ.py: {disposition: legacy_only, reason: occlusion-label study}
  carla_uav_tracking/scripts/_occ_montage.py: {disposition: legacy_only, reason: occlusion-label study}
