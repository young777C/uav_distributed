# Sim-proxy perception protocol v2 (framework §5.2) — the frozen evaluation protocol of the final model and of every 1004
# arm. "Deployable form" closed loop whose PERCEPTION is supplied by the simulator (see privileged_perception).
# Frozen: any change = a new version file. Arms may override frontend.* / perception.* only with `ablation:`.
name: sim_proxy_v2
version: 1
aliases: [deploy_v2]
description: tracker ids + ray-cast occlusion-aware candidates + attribute opening v1 (1004)
camera: {fov_deg: 90.0, width: 512, height: 512, fps: 10}
sim:
  s2_period: 6                  # 1 S2 tick = 0.6 s
  episode_steps: 900
  scenario: mvp
  max_lost_s: 18.0              # = carla_uav_tracking/config/default.yaml environment.max_lost_seconds (checked)
  warmup: {expert_ticks: 90, min_target_speed_mps: 1.2}
  retarget_tick: null
perception:
  candidates: {source: sim_projection, set: task_vehicles, vehicle_size_m: 4.0, box_min_px: 10.0, box_max_px: 140.0}
  occlusion: raycast            # run_rollout --vis-raycast + policy --occl-cands
  identity_keys: tracker        # policy --tracklets tracker (GT-free tracklet ids)
  tracker: {max_age: 8, gate_px: 150.0, gate_box: 2.0, w_app: 0.85, min_cos: 0.2, vel_beta: 0.5, app_alpha: 0.3}
  where_localisation: gt_matched_box
  noise: none
frontend:
  vlm: {model_config: train/config_v5.yaml, stage2_ckpt: runs/stage2_v5/stage2_best.pt, language_mode: neutral}
  crop_features: {id: dino_s14_lvd142m_cls384_c224_p1.3, depth_scale: 100.0}
  opening:
    module: attr
    hires_k: 3
    window: 3
    agg: sum
    final_reset: false
    reset_asd: false
    force_final: false
    seed_asd: 0.0
    attr:
      ckpt_lin: carla_uav_tracking/rollout/eval_out/opening_attr_cls.pt
      ckpt_ft: carla_uav_tracking/rollout/eval_out/opening_attr_ft.pt     # path hard-coded in opening_zoom.py until P2
      wm: 1.0
      wc: 1.0
      wq: 0.0
      ft: 0.5
scorer: {commit_k: 5, t_fail_s: 2.0, central_frac: 0.3, primary: committed}
privileged_perception: [cand_box_gt_projection, cand_depth_gt, occlusion_raycast_gt, task_vehicle_set,
                        where_world_gt_matched_box]
