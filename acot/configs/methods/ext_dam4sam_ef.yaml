# 1024 External baseline (module substitution, B layer; acot_note/1024_baselines_ablations_design.md §3): DAM4SAM
# (CVPR'25, distractor-aware SAM2.1++ memory) as the WHICH module, fed EVERY camera frame (10 Hz) like the official
# DeepSORT / OC-SORT heads (ext_deepsort / ext_ocsort), instead of the S2 ticks only (1.67 Hz, ext_dam4sam). Memory
# initialised from the shared opening pick; at each S2 tick its box is snapped to the nearest candidate within
# gate_px and goes through the shared commitment rule. The backbone is the service's --model (sam21pp-L for the
# official DAM4SAM); the runtime does not pass identity.dam4sam.model to the service.
name: ext_dam4sam_ef
extends: ext_dam4sam
identity:
  dam4sam: {every_frame: true}
