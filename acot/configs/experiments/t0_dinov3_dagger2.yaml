# acot/prep/tah_dagger_merge.py → runs/tah_1006/tah_cache_dinov3_dag.pt (same composition as runs/tah_cache_dag.pt).
name: t0_dinov3_dagger2
protocol: sim_proxy_v2@3
seeds: {set: train_dagger_v1, expect: 24}
completeness: {require: allow_skipped, allow_skipped_reasons: ["target stationary"], pairing: intersection}
schedule: {block: 4, seed: 10081, max_infra_attempts: 3}
arms:
  dag_v3off: {method: ours_v3off, role: main}
collect: [ticks, tah_dagger, scenario]
infra: {runtime: acot}
