# 1006 DINOv3 stage 2 (two-stage rule, user decision 2026-10-06; 1006_t0_log.md): one DAgger round of the DINOv3
# learner (ours_v3off) on the seeds of the DINOv2 DAgger set (train_dagger_v1, Town05 92000–92023), protocol @3.
# collect tah_dagger = the TAH inputs of every S2 tick (DINOv3 crop features the head scored + positions) with the GT
