# 1024 OA-VAT closed loop WITH the occlusion-aware planner — smoke (plan v4 §10.3): G2 + planner on one seed per dev-S
# town, twice (run-to-run variability); 94098 (Town10HD, 20 mission restarts in open-loop r5) for the planner path in the
# offline server check. Not used for selection.
name: stress_tune_oavatcl_dpsmoke
protocol: sim_proxy_v2@4
seeds: {set: stress_tune, subset: [[94000, 94000], [94040, 94040]], expect: 2}
completeness: {require: allow_skipped, allow_skipped_reasons: ["target stationary"], pairing: intersection}
schedule: {block: 2, seed: 10243, max_infra_attempts: 2}
arms:
  g2dp:     {method: ext_oavat_full_g2_dp}
  g2dp_rep: {method: ext_oavat_full_g2_dp}
collect: [ticks, trk, gt_access, scenario, oavat_frames]
infra: {runtime: acot, watchdog: {first_min: 60, stall_min: 40, max_restarts: 3}}
