# 1006 CARLA non-determinism study (user decision 2026-10-06 after the pilot freeze): the SAME arm (Ours, repeat 0 =
# identical policy RNG) run three times on the same seeds; every act message (RGB, proprio, GT state) is recorded so
# the first diverging step and component (traffic / physics / rendering / policy) can be located.
name: t0_determinism
protocol: sim_proxy_v2@2
seeds: {set: dev2, subset: [[93060, 93061]], expect: 2}
completeness: {require: allow_skipped, allow_skipped_reasons: ["target stationary"], pairing: intersection}
schedule: {block: 1, seed: 10067, max_infra_attempts: 3}
arms:
  det_a: {method: ours_final, role: main}
  det_b: {method: ours_final, role: main}
  det_c: {method: ours_final, role: main}
collect: [ticks, gt_access, scenario, record_act]
infra: {runtime: acot, record_act_ticks: 900}
