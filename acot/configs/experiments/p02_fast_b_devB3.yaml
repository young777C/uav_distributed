seeds: {set: dev2, subset: [[93060, 93099]], expect: 40}
completeness: {require: allow_skipped, allow_skipped_reasons: ["target stationary"], pairing: intersection}
schedule: {block: 5, seed: 10144, max_infra_attempts: 3}
arms:
  fb_r0: {method: ours_fast_b, role: ablation, override: {identity.conf_tau: 0.05}}
  fb_r1: {method: ours_fast_b, role: ablation, repeat: 1, override: {identity.conf_tau: 0.05}}
collect: [ticks, gt_access, scenario]
infra: {runtime: acot}
