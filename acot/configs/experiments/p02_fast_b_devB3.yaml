# P0-2 stage B closed-loop gate (acot_note/1012_p02_identity_retrain.md §6.4, fixed 2026-10-14 before collecting the
# @3 DAgger): the existing Ours setting (ours_final + conf_tau 0.05) with ONLY the TAH weights replaced by the stage-B
# retrain (method ours_fast_b, generated by runs/p02_retrain/select_and_pin.py --val tah_dagger_v3_val), dev-B
# 93060–93099, protocol @3, natural opening, r = 2. Reference (seed- and repeat-paired): opt1_screen_devB3 tau005
# (repeat 0) + opt2a_screen_devB3 tau005_r1 (repeat 1). Secondary: against stage A (p02_fast_a_devB3 fa_r0 / fa_r1).
