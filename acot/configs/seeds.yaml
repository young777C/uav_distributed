# Seed registry (framework §5.4). A seed's identity is (town, seed). Ranges are INCLUSIVE [lo, hi]. Sets of different
# purposes must not overlap (acot lint). `locked` sets need --allow-test and the experiment's prereg_ref.
seedsets:
  datagen_mvp_v5:
    purpose: train_data
    description: 64-episode mvp_full_v5 / _fov90 data-gen plan (seed→town), incl. substitute 108 for 49
