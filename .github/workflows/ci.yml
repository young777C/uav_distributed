# Paper1Lite + policy registry tests (OR-Tools required for slow-loop MILP).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-paper1.txt pytest

      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests/ -q
